version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: portal-partners-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: portal-partners-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_URL: ${MINIO_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}

    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: 
      - mino_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f",  "http://localhost:9000/minio/health/live"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal-partners-backend
    ports: 
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      MINIO_URL: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}

      APP_FRONTEND_URL: ${APP_FRONTEND_URL}

      # Criptografia de campos sensiveis (AES-256-GCM) — gerar com: openssl rand -base64 32
      APP_FIELD_ENCRYPTION_KEY: ${APP_FIELD_ENCRYPTION_KEY}

      # LGPD
      APP_LGPD_VERSAO_TERMO_ATUAL: ${APP_LGPD_VERSAO_TERMO_ATUAL:-v1.0}
      APP_LGPD_TERMO_HASH_ATUAL: ${APP_LGPD_TERMO_HASH_ATUAL}
      APP_LGPD_TERMO_TEXTO_ATUAL: ${APP_LGPD_TERMO_TEXTO_ATUAL:-Autorizo o tratamento dos meus dados pessoais estritamente para cadastro, upload, armazenamento, analise documental, auditoria e cumprimento de obrigacoes legais e contratuais no Portal Partners, conforme a LGPD.}

    depends_on:
      postgres: 
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal-partners-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}

volumes:
  postgres_data:
  mino_data:
