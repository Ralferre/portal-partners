# Blueprint do Render — ambiente de DEMONSTRACAO do Portal Partners.
#
# Objetivo: colocar a aplicacao numa URL publica usando apenas a conta do
# Render, sem contratar storage externo e sem custo.
#
# LIMITES ACEITOS NESTA CONFIGURACAO (leia antes de usar com gente de verdade):
#   - Servicos gratuitos hibernam apos inatividade: o primeiro acesso demora
#     cerca de 1 minuto ate a aplicacao acordar.
#   - O plano gratuito de Postgres do Render expira em poucas semanas e o banco
#     e removido COM OS DADOS.
#   - O MinIO roda sem disco persistente: os documentos enviados somem a cada
#     redeploy ou reinicio do servico.
#
# Ou seja: serve para demonstrar e validar o fluxo, NAO para operar com
# documento real de funcionario. Como promover para producao esta no final
# deste arquivo.
#
# Passo a passo: DEPLOY.md

databases:
  - name: portal-partners-db
    databaseName: portalpartners
    user: portalpartners
    plan: free
    postgresMajorVersion: "16"

services:
  # ---------------- Storage (MinIO) ----------------
  # Mesmo MinIO do docker-compose local, agora hospedado ao lado da API.
  # Nenhuma linha de MinioService muda: e o mesmo protocolo S3.
  - type: web
    name: portal-partners-minio
    runtime: image
    plan: free
    region: oregon
    image:
      url: docker.io/minio/minio:latest
    # O Render roteia trafego externo para uma unica porta. Expomos a API S3
    # (9000); o console web (9001) fica acessivel apenas dentro do servico.
    dockerCommand: minio server /tmp/minio-data --address :9000 --console-address :9001

    envVars:
      - key: PORT
        value: "9000"
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false

  # ---------------- API (Spring Boot) ----------------
  - type: web
    name: portal-partners-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase: { name: portal-partners-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: portal-partners-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: portal-partners-db, property: database }
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase: { name: portal-partners-db, property: user }
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase: { name: portal-partners-db, property: password }

      - key: SPRING_JPA_DDL_AUTO
        value: validate
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      # Instancia gratuita tem pouca memoria; sem isso a JVM pode ser morta.
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -Xss512k

      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      # openssl rand -base64 32 — sem ela a aplicacao nao sobe (por design).
      - key: APP_FIELD_ENCRYPTION_KEY
        sync: false

      # Preencher DEPOIS do primeiro deploy, com as URLs reais (DEPLOY.md).
      - key: APP_FRONTEND_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # URL publica desta propria API: o link de download de uso unico
      # aponta para ela e precisa ser alcancavel pelo navegador.
      - key: APP_API_URL
        sync: false

      # --- Storage: apontar para o servico MinIO acima ---
      # As duas URLs recebem o mesmo valor (a URL publica do servico MinIO).
      # A presigned URL e assinada para um host especifico: se a URL usada na
      # assinatura for diferente da que o browser acessa, o storage rejeita.
      - key: MINIO_URL
        sync: false
      - key: MINIO_PUBLIC_URL
        sync: false
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET_NAME
        value: portal-partners
      - key: MINIO_REGION
        value: ""
      # false = modo permissivo. A API sobe mesmo se o storage estiver
      # hibernado; upload e download falham ate ele acordar.
      # Em producao: true.
      - key: MINIO_BUCKET_ENCRYPTION_REQUIRED
        value: "false"

      # --- E-mail (Gmail SMTP) ---
      # Recuperacao de senha ("esqueci minha senha"). Usar app password do
      # Gmail (conta com 2FA). NUNCA commitar a senha — preencher no painel.
      # Sem MAIL_USERNAME/MAIL_PASSWORD tudo funciona, exceto o envio de e-mail.
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

      # --- Seed dos tres perfis ---
      # Ligar apenas no primeiro deploy e voltar para false (DEPLOY.md).
      - key: APP_SEED_ENABLED
        value: "false"
      - key: APP_SEED_ADMIN_PASSWORD
        sync: false
      - key: APP_SEED_CONTRATANTE_PASSWORD
        sync: false
      - key: APP_SEED_CONTRATADA_PASSWORD
        sync: false

      # --- Documentos de demonstracao (PDFs ficticios 4dev) ---
      # true popula a base com 10 documentos de exemplo para apresentacao.
      # NUNCA cria/altera usuarios. Deixar false em producao real.
      - key: APP_DEMO_DOCS_ENABLED
        value: "false"

      # --- Observabilidade (Sentry) ---
      # Plano Developer (free). Deixe SENTRY_DSN vazio para desligar.
      # NUNCA commitar o DSN — preencher no painel do Render.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

      - key: APP_LGPD_VERSAO_TERMO_ATUAL
        value: v1.0
      - key: APP_LGPD_TERMO_HASH_ATUAL
        sync: false

  # ---------------- Frontend ----------------
  # Sites estaticos no Render nao hibernam e nao tem custo: a tela de login
  # abre na hora. A espera do cold start acontece na primeira chamada a API.
  - type: web
    name: portal-partners-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      # Gravado dentro do bundle no BUILD. Mudar exige novo build.
      - key: VITE_API_BASE_URL
        sync: false
      # Observabilidade do frontend (Sentry free). Vazio desliga.
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY

# ============================================================================
# COMO PROMOVER PARA PRODUCAO
#
# 1. Banco: plan free -> basic-256mb (ou superior). Backup e retencao passam
#    a existir. Migre os dados antes do plano gratuito expirar. O schema ja e
#    gerenciado por Flyway (SPRING_JPA_DDL_AUTO=validate) — migrations em
#    db/migration sao aplicadas automaticamente no deploy.
# 2. API: plan free -> starter. Some a hibernacao e o cold start. Enquanto no
#    free, o frontend exibe a tela "Iniciando..." (BootGate) durante o wake-up.
# 3. Storage — RECOMENDADO: Cloudflare R2 (nao hiberna, free tier real,
#    S3-compativel). Resolve o "despertar manual" do MinIO. Basta definir:
#       MINIO_URL / MINIO_PUBLIC_URL = https://<accountid>.r2.cloudflarestorage.com
#       MINIO_ACCESS_KEY / MINIO_SECRET_KEY = token R2 (Object Read & Write)
#       MINIO_REGION = auto
#       MINIO_BUCKET_NAME = portal-partners
#       MINIO_BUCKET_ENCRYPTION_REQUIRED = false   (R2 cifra em repouso por
#         padrao e NAO suporta setBucketEncryption via API S3; o modo permissivo
#         evita falha de boot — nenhuma mudanca de codigo no MinioService)
#    CORS do bucket R2 e OBRIGATORIO (presigned PUT/GET vem do browser):
#       AllowedOrigins: a origem do frontend (ex: https://<app>.pages.dev)
#       AllowedMethods: GET, PUT   | AllowedHeaders: *   | ExposeHeaders: ETag
# 4. SMTP real (Gmail): ver DEPLOY.md para gerar o app password.
# 5. Observabilidade: criar projeto no Sentry (plano Developer/free, SEM cartao)
#    e preencher SENTRY_DSN (API) e VITE_SENTRY_DSN (frontend).
# ============================================================================
