# --- DATABASE ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- MINIO ---
minio.url=${MINIO_URL}
minio.public-url=${MINIO_PUBLIC_URL:${MINIO_URL}}
minio.root-user=${MINIO_ROOT_USER}
minio.root-password=${MINIO_ROOT_PASSWORD}
minio.bucket-name=${MINIO_BUCKET_NAME}
minio.bucket-encryption-required=${MINIO_BUCKET_ENCRYPTION_REQUIRED:true}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# --- EMAIL ---
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

mail.from=${MAIL_FROM:no-reply@portal-partners.local}

# --- APP ---
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
# Seeder de dados iniciais (manter false em producao)
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.contratante-password=${APP_SEED_CONTRATANTE_PASSWORD:}
app.seed.contratada-password=${APP_SEED_CONTRATADA_PASSWORD:}

# --- CRIPTOGRAFIA DE CAMPOS SENSIVEIS (AES-256-GCM) ---
# Gerar: openssl rand -base64 32
# NUNCA commitar o valor real. Usar variavel de ambiente em producao.
app.field-encryption-key=${APP_FIELD_ENCRYPTION_KEY:CHAVE_PLACEHOLDER_SUBSTITUA_EM_PRODUCAO_32B}

# --- LGPD ---
app.lgpd.versao-termo-atual=${APP_LGPD_VERSAO_TERMO_ATUAL:v1.0}
# SHA-256 do texto integral do termo exibido ao usuario
app.lgpd.termo-hash-atual=${APP_LGPD_TERMO_HASH_ATUAL:HASH_PLACEHOLDER_SUBSTITUA}
app.lgpd.termo-texto-atual=${APP_LGPD_TERMO_TEXTO_ATUAL:Autorizo o tratamento dos meus dados pessoais estritamente para cadastro, upload, armazenamento, analise documental, auditoria e cumprimento de obrigacoes legais e contratuais no Portal Partners, conforme a LGPD.}
