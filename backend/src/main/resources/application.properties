# --- DATABASE ---
# SPRING_DATASOURCE_URL tem prioridade (docker-compose local).
# Se nao vier, a URL e montada a partir de DB_HOST/DB_PORT/DB_NAME, que e o
# formato que provedores gerenciados (Render, Railway) expoem. Eles fornecem
# uma connection string postgres:// que NAO e uma URL JDBC valida.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portalpartners}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# ATENCAO: o schema agora e gerenciado por Flyway (ver db/migration).
# Em producao/deploy use 'validate': o Hibernate apenas confere que o schema
# versionado bate com as entidades, sem alterar nada. 'update' fica reservado
# apenas para desenvolvimento local pontual (perfil dev), nunca em producao.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
# SQL no log expoe dado sensivel e polui o log de producao: default false.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# --- FLYWAY (migracao de schema) ---
# baseline-on-migrate permite adotar Flyway num banco que ja tinha schema
# criado por ddl-auto=update: ele marca o estado atual como baseline e aplica
# apenas as migrations seguintes. Em banco vazio, aplica tudo a partir da V1.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# --- SERVIDOR ---
# Provedores de deploy injetam a porta em PORT. O Spring Boot nao le PORT
# sozinho: sem isso o Tomcat sobe em 8080 e o health check do provedor falha.
server.port=${PORT:8080}

# --- HEALTHCHECK ---
# /actuator/health exposto para o provedor de deploy saber se a instancia vive.
management.endpoints.web.exposure.include=health
# Detalhes (db, storage) visiveis apenas para quem esta autenticado — a tela
# admin consome isso. Para o publico/healthcheck, apenas UP/DOWN.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

# Grupo "liveness": o que o provedor de deploy consulta
# (/actuator/health/liveness). NAO inclui o storage: a indisponibilidade do
# MinIO/R2 (ex: cold start) nao deve derrubar a instancia viva. Inclui apenas
# o essencial (banco e ping), que de fato indica se a API esta sadia.
management.endpoint.health.group.liveness.include=db,ping
management.endpoint.health.group.liveness.show-details=never

# O indicador de mail abre conexao SMTP a cada checagem. Sem SMTP configurado
# ele reprova e derruba o health agregado para DOWN, mesmo com a aplicacao sa.
management.health.mail.enabled=false
# Diskspace nao e relevante para a nossa operacao (storage e externo S3).
management.health.diskspace.enabled=false

# --- UPLOAD ---
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}

# --- MINIO ---
minio.url=${MINIO_URL}
minio.public-url=${MINIO_PUBLIC_URL:${MINIO_URL}}
minio.root-user=${MINIO_ROOT_USER}
minio.root-password=${MINIO_ROOT_PASSWORD}
minio.bucket-name=${MINIO_BUCKET_NAME}
minio.bucket-encryption-required=${MINIO_BUCKET_ENCRYPTION_REQUIRED:true}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
# Vazio no MinIO local. Cloudflare R2: auto. AWS S3: a region do bucket.
minio.region=${MINIO_REGION:}

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# --- EMAIL ---
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

mail.from=${MAIL_FROM:no-reply@portal-partners.local}

# --- APP ---
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
# URL publica desta API. O link de download de uso unico e absoluto e aponta
# para ca, entao precisa ser o endereco que o navegador do usuario alcanca.
app.api-url=${APP_API_URL:http://localhost:8080}
# Origens autorizadas a chamar a API pelo browser (lista separada por virgula).
# Em producao precisa conter o dominio publico do frontend.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
# Seeder de dados iniciais (manter false em producao)
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.contratante-password=${APP_SEED_CONTRATANTE_PASSWORD:}
app.seed.contratada-password=${APP_SEED_CONTRATADA_PASSWORD:}
# Seeder ADITIVO de documentos de demonstracao (PDFs ficticios 4dev).
# Nunca cria/altera usuarios. Ligar apenas em ambiente de demo.
app.demo.docs.enabled=${APP_DEMO_DOCS_ENABLED:false}

# --- CRIPTOGRAFIA DE CAMPOS SENSIVEIS (AES-256-GCM) ---
# Gerar: openssl rand -base64 32
# NUNCA commitar o valor real. Usar variavel de ambiente em producao.
app.field-encryption-key=${APP_FIELD_ENCRYPTION_KEY:CHAVE_PLACEHOLDER_SUBSTITUA_EM_PRODUCAO_32B}

# --- LGPD ---
app.lgpd.versao-termo-atual=${APP_LGPD_VERSAO_TERMO_ATUAL:v1.0}
# SHA-256 do texto integral do termo exibido ao usuario
app.lgpd.termo-hash-atual=${APP_LGPD_TERMO_HASH_ATUAL:HASH_PLACEHOLDER_SUBSTITUA}
app.lgpd.termo-texto-atual=${APP_LGPD_TERMO_TEXTO_ATUAL:Autorizo o tratamento dos meus dados pessoais estritamente para cadastro, upload, armazenamento, analise documental, auditoria e cumprimento de obrigacoes legais e contratuais no Portal Partners, conforme a LGPD.}


# --- OBSERVABILIDADE (SENTRY) ---
# DSN vem de variavel de ambiente; vazio desliga o Sentry (dev/test/local).
# NUNCA commitar o DSN. Plano Developer (free): manter sampling de performance
# em 0 para nao consumir a quota — so capturamos erros.
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=0.0
# Nao anexar PII automaticamente (IP, cookies, headers de usuario).
sentry.send-default-pii=false
sentry.environment=${SENTRY_ENVIRONMENT:production}
# Nao enviar nada em ambientes sem DSN configurado.
sentry.enable-tracing=false
