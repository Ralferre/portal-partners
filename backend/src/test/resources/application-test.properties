# =====================================================================
# Perfil de TESTE
# Datasource e MinIO sao fornecidos dinamicamente pelos Testcontainers
# (ver AbstractIntegrationTest). Aqui ficam apenas valores estaticos
# que nao dependem de container.
# =====================================================================

# Flyway cuida do schema; Hibernate apenas valida contra as entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false

# Storage em modo permissivo nos testes: o BucketInitializer nao derruba o
# contexto se o container ainda estiver subindo.
minio.bucket-encryption-required=false
minio.bucket-name=portal-partners-test
minio.region=

# JWT de teste (valor nao-sensivel, apenas para assinar tokens em memoria).
jwt.secret=test-secret-test-secret-test-secret-test-secret-0123456789
jwt.expiration=86400000

# Criptografia de campos: chave fixa de teste (32 bytes base64). Nao e segredo
# de producao — serve apenas para os testes de ida/volta de CPF cifrado.
app.field-encryption-key=dGVzdC1maWVsZC1lbmNyeXB0aW9uLWtleS0zMmJ5dGU=

# LGPD
app.lgpd.versao-termo-atual=v1.0
app.lgpd.termo-hash-atual=test-hash
app.lgpd.termo-texto-atual=Termo de teste.

# E-mail desligado nos testes.
spring.mail.host=localhost
spring.mail.port=2525
mail.from=no-reply@test.local

app.frontend-url=http://localhost:5173
app.api-url=http://localhost:8080
app.cors.allowed-origins=http://localhost:5173

# Sentry desligado em teste.
sentry.dsn=
