server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressao dos assets de texto.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets com hash no nome podem ser cacheados de forma agressiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html NUNCA pode ser cacheado: e ele que aponta para o bundle novo
    # a cada deploy. Cachear aqui faz o usuario ficar preso na versao antiga.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback: o React Router resolve as rotas no cliente, entao qualquer
    # path desconhecido devolve o index.html em vez de 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabecalhos de seguranca basicos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
