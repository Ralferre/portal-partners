name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Compilar e empacotar
        working-directory: backend
        run: mvn -B -ntp package

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --no-audit
      - name: Build de producao
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.invalid
        run: npm run build

  docker:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    steps:
      - uses: actions/checkout@v4
      - name: Imagem da API
        run: docker build -f backend/Dockerfile -t portal-partners-api:ci backend
      - name: Imagem do frontend
        run: |
          docker build -f frontend/Dockerfile --target prod \
            --build-arg VITE_API_BASE_URL=https://api.invalid \
            -t portal-partners-web:ci frontend
